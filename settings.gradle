pluginManagement {
    includeBuild('build-logic')
    repositories {
        gradlePluginPortal()
        mavenCentral()

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('net.fabricmc.fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'SmartBreedingTroughs'

def dirigoCandidates = ['../Dirigo', '../dirigo']
def dirigoPath = dirigoCandidates.find { file(it).exists() }
if (dirigoPath != null) {
    includeBuild(dirigoPath) {
        dependencySubstitution {
            substitute(module('io.drahlek:common')).using(project(':common'))
            substitute(module('io.drahlek:fabric')).using(project(':fabric'))
            substitute(module('io.drahlek:neoforge')).using(project(':neoforge'))
        }
    }
} else {
    logger.warn("Dirigo sibling repo not found (checked: ${dirigoCandidates.join(', ')}). Composite dependency substitution is disabled.")
}
include('common')
include('fabric')
include('neoforge')

