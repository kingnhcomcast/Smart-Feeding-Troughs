plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

configurations {
    commonClientResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
}

configurations.configureEach { cfg ->
    if (cfg.name == 'clientImplementation') {
        cfg.extendsFrom(configurations.implementation)
    }
    if (cfg.name == 'clientCompileOnly') {
        cfg.extendsFrom(configurations.compileOnly)
    }
    if (cfg.name == 'clientRuntimeOnly') {
        cfg.extendsFrom(configurations.runtimeOnly)
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

def dirigoFabricDependency = "io.drahlek:fabric:${dirigo_min_version}"
def dirigoReflectionsVersion = "0.10.2"
def dirigoIncludedBuild = gradle.includedBuilds.find { it.name == 'Dirigo' || it.name == 'dirigo' }
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    compileOnly(dirigoFabricDependency) {
        capabilities {
            requireCapability("io.drahlek:dirigo-fabric-${minecraft_version}:${dirigo_min_version}")
        }
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
    runtimeOnly "org.reflections:reflections:${dirigoReflectionsVersion}"
    runtimeOnly "org.javassist:javassist:3.28.0-GA"
    runtimeOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Dirigo common is provided at runtime by the Dirigo Fabric mod artifact.
    compileOnly("io.drahlek:common:${dirigo_min_version}") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }

    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"
    compileOnly "org.projectlombok:lombok:1.18.44"
    annotationProcessor "org.projectlombok:lombok:1.18.44"

    add("commonClientResources", project(path: ':common', configuration: 'commonClientResources'))
    add("commonClientJava", project(path: ':common', configuration: 'commonClientJava'))
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet project(":common").sourceSets.main
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.client
            sourceSet sourceSets.client
        }
    }

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def dirigoFabricJar = rootProject.file("../Dirigo/fabric/build/libs/dirigo-fabric-${minecraft_version}-${dirigo_min_version}.jar")
def dirigoFabricRemapJar = gradle.includedBuild('Dirigo').task(':fabric:remapJar')

tasks.named('runClient') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        def existingMods = systemProperties.get('fabric.addMods')?.toString()
        def modPaths = ([dirigoFabricJar.absolutePath] + (existingMods == null || existingMods.isBlank() ? [] : existingMods.split(java.util.regex.Pattern.quote(File.pathSeparator)) as List<String>))
            .findAll { it != null && !it.isBlank() }
            .unique()
        systemProperty('fabric.addMods', modPaths.join(File.pathSeparator))
    }
}

tasks.named('runServer') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        def existingMods = systemProperties.get('fabric.addMods')?.toString()
        def modPaths = ([dirigoFabricJar.absolutePath] + (existingMods == null || existingMods.isBlank() ? [] : existingMods.split(java.util.regex.Pattern.quote(File.pathSeparator)) as List<String>))
            .findAll { it != null && !it.isBlank() }
            .unique()
        systemProperty('fabric.addMods', modPaths.join(File.pathSeparator))
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
// Implement mcgradleconventions loader attribute
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

tasks.register("copyExtraJars", Copy) {
    from("${projectDir}/extraJars")
    include("*.jar")
    into(project.file("runs/server/mods"))
}

tasks.named('assemble') {
    if (dirigoIncludedBuild != null) {
        dependsOn(dirigoIncludedBuild.task(':fabric:assemble'))
    }
}

tasks.named('build') {
    if (dirigoIncludedBuild != null) {
        dependsOn(dirigoIncludedBuild.task(':fabric:build'))
    }
}

tasks.named('clean') {
    if (dirigoIncludedBuild != null) {
        dependsOn(dirigoIncludedBuild.task(':fabric:clean'))
    }
}

tasks.named('runServer') {
    dependsOn 'copyExtraJars'
}

tasks.named('processClientResources') {
    dependsOn(configurations.commonClientResources)
    from(configurations.commonClientResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileClientJava', JavaCompile) {
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

tasks.named('runClient') {
    dependsOn(gradle.includedBuild('Dirigo').task(':fabric:jar'))
}

tasks.named('runServer') {
    dependsOn(gradle.includedBuild('Dirigo').task(':fabric:jar'))
}

tasks.named('runDatagen') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        def existingMods = systemProperties.get('fabric.addMods')?.toString()
        def modPaths = ([dirigoFabricJar.absolutePath] + (existingMods == null || existingMods.isBlank() ? [] : existingMods.split(java.util.regex.Pattern.quote(File.pathSeparator)) as List<String>))
                .findAll { it != null && !it.isBlank() }
                .unique()
        systemProperty('fabric.addMods', modPaths.join(File.pathSeparator))
    }
}