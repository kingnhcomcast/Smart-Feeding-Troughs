plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

def dirigoFabricDevJar = files(rootProject.file("../Dirigo/fabric/build/devlibs/dirigo-fabric-${minecraft_version}-${dirigo_min_version}-dev.jar"))
def dirigoReflectionsVersion = "0.10.2"

configurations {
    commonClientResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
    fabricRunModCandidates {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Keep the 1.21.1 compile path, but use Dirigo's named dev jar at runtime so
    // Fabric does not boot against the intermediary runtime artifact.
    modRuntimeOnly(dirigoFabricDevJar)
    runtimeOnly "org.reflections:reflections:${dirigoReflectionsVersion}"
    runtimeOnly "org.javassist:javassist:3.28.0-GA"
    runtimeOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Dirigo is supplied at runtime via the Fabric dev jar above. Keep the shared
    // API on the compile classpath only so IDE task inspection does not eagerly
    // resolve the included build through clientRuntimeClasspath.
    def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
    compileOnly("io.drahlek:common:${dirigo_min_version}") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }

    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.3.5"
    compileOnly "org.projectlombok:lombok:1.18.44"
    annotationProcessor "org.projectlombok:lombok:1.18.44"

    add("commonClientResources", project(path: ':common', configuration: 'commonClientResources'))
    add("commonClientJava", project(path: ':common', configuration: 'commonClientJava'))
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet project(":common").sourceSets.main
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.client
            sourceSet sourceSets.client
        }
    }

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def dirigoFabricJar = rootProject.file("../Dirigo/fabric/build/libs/dirigo-fabric-${minecraft_version}-${dirigo_min_version}.jar")
def dirigoFabricRemapJar = gradle.includedBuild('Dirigo').task(':fabric:remapJar')

tasks.named('runClient') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        systemProperty('fabric.addMods', ([dirigoFabricJar.absolutePath] + configurations.fabricRunModCandidates.files.collect { it.absolutePath }).join(File.pathSeparator))
    }
}

tasks.named('runServer') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        systemProperty('fabric.addMods', ([dirigoFabricJar.absolutePath] + configurations.fabricRunModCandidates.files.collect { it.absolutePath }).join(File.pathSeparator))
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

tasks.register("copyExtraJars", Copy) {
    from("${projectDir}/extraJars")
    include("*.jar")
    into(project.file("runs/server/mods"))
}

tasks.named('runServer') {
    dependsOn 'copyExtraJars'
}

tasks.named('processClientResources') {
    dependsOn(configurations.commonClientResources)
    from(configurations.commonClientResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileClientJava', JavaCompile) {
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

tasks.named('runClient') {
    dependsOn(gradle.includedBuild('Dirigo').task(':fabric:jar'))
}

tasks.named('runServer') {
    dependsOn(gradle.includedBuild('Dirigo').task(':fabric:jar'))
}
