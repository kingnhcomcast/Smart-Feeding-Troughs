plugins {
    id 'multiloader-loader'
    id 'multiloader-fabric-composite'
    id 'net.fabricmc.fabric-loom'
}

configurations {
    commonClientResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    developmentModImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    developmentModImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    developmentModImplementation "io.drahlek:fabric:${dirigo_min_version}"

    def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
    // Dirigo common is provided at runtime by the Dirigo Fabric mod artifact.
    compileOnly("io.drahlek:common:${dirigo_min_version}") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
    compileOnly "org.projectlombok:lombok:1.18.44"
    annotationProcessor "org.projectlombok:lombok:1.18.44"

    add("commonClientResources", project(path: ':common', configuration: 'commonClientResources'))
    add("commonClientJava", project(path: ':common', configuration: 'commonClientJava'))
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            programArgs '--username', 'TemplateDev'
            programArgs '--uuid', '00000000-0000-0000-0000-000000000001'
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }

    log4jConfigs.from "log4j-dev.xml"
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

tasks.register("copyExtraJars", Copy) {
    from("${projectDir}/extraJars")
    include("*.jar")
    into(project.file("runs/server/mods"))
}

tasks.named('runServer') {
    dependsOn 'copyExtraJars'
}

tasks.named('processClientResources') {
    dependsOn(configurations.commonClientResources)
    from(configurations.commonClientResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileClientJava', JavaCompile) {
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}
