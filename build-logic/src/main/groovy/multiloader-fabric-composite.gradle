configurations {
    // Dependencies declared here are available to Java compile/runtime classpaths
    // and are also surfaced to Fabric Loader as dev-run mod candidates.
    developmentModImplementation {
        canBeResolved = false
        canBeConsumed = false
    }
    developmentModRuntimeOnly {
        canBeResolved = false
        canBeConsumed = false
    }
    developmentFabricMods {
        canBeResolved = true
        canBeConsumed = false
        extendsFrom(configurations.developmentModImplementation, configurations.developmentModRuntimeOnly)
    }
}

configurations.named('implementation') {
    extendsFrom(configurations.developmentModImplementation)
}

configurations.named('runtimeOnly') {
    extendsFrom(configurations.developmentModRuntimeOnly)
}

afterEvaluate {
    def joinPaths = { Collection<String> paths ->
        paths.findAll { it != null && !it.isBlank() }
            .unique()
            .join(File.pathSeparator)
    }
    def splitPaths = { String paths ->
        if (paths == null || paths.isBlank()) {
            return []
        }
        paths.split(java.util.regex.Pattern.quote(File.pathSeparator)) as List<String>
    }
    def resolveConfigurationFiles = { String configurationName ->
        def configuration = configurations.findByName(configurationName)
        if (configuration == null || !configuration.canBeResolved) {
            return []
        }
        configuration.files.findAll { it.exists() && it.name.endsWith('.jar') }
    }
    def resolveDevelopmentModPaths = {
        // Fabric Loader needs explicit mod candidate paths for included-build mods in dev runs.
        configurations.developmentFabricMods.files
            .findAll { it.exists() }
            .collect { it.absolutePath }
    }
    def resolveRuntimeModPaths = { String mappedModConfigurationName, String runtimeConfigurationName ->
        def runtimeFabricModPaths = resolveConfigurationFiles('modCompileClasspath')
            .findAll {
                def normalizedPath = it.absolutePath.replace('\\', '/')
                it.name.startsWith('fabric-loader-') ||
                    normalizedPath.contains('/net.fabricmc.fabric-api/')
            }
            .collect { it.absolutePath }
        runtimeFabricModPaths
    }
    def appendDevelopmentModPaths = { task, Collection<String> developmentModPaths ->
        def mergedModPaths = joinPaths(splitPaths(task.systemProperties.get('fabric.addMods')?.toString()) + developmentModPaths)
        if (!mergedModPaths.isBlank()) {
            task.systemProperty('fabric.addMods', mergedModPaths)
        }
    }

    tasks.named('runClient') {
        dependsOn(tasks.named('jar'))
        doFirst {
            def clientDevelopmentModPaths = [
                *resolveRuntimeModPaths('modRuntimeClasspathClientMapped', 'clientRuntimeClasspath'),
                *resolveDevelopmentModPaths(),
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath
            ]
            appendDevelopmentModPaths(it, clientDevelopmentModPaths)
        }
    }

    tasks.named('runDatagen') {
        dependsOn(tasks.named('jar'))
        doFirst {
            def datagenDevelopmentModPaths = [
                *resolveRuntimeModPaths('modRuntimeClasspathMainMapped', 'runtimeClasspath'),
                *resolveDevelopmentModPaths(),
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath
            ]
            appendDevelopmentModPaths(it, datagenDevelopmentModPaths)
        }
    }

    tasks.named('runServer') {
        doFirst {
            appendDevelopmentModPaths(
                it,
                resolveRuntimeModPaths('modRuntimeClasspathMainMapped', 'runtimeClasspath') + resolveDevelopmentModPaths()
            )
        }
    }
}
